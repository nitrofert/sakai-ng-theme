<div class="webcam-container">
  <!-- Video en vivo -->
  <video #video autoplay playsinline class="video-preview"></video>

  <!-- Canvas oculto (usado para capturar foto) -->
  <canvas #canvas class="canvas-preview"></canvas>

  <!-- Botones de acción -->
<div class="actions">
    <button pButton type="button" label="📸 Capturar" (click)="capturarFoto()" [disabled]="loading"></button>
    <button pButton type="button" label="💾 Guardar" (click)="guardarFoto()" [disabled]="loading || !imagenDataURL"></button>
    <button pButton type="button" label="🔄 Cambiar cámara" (click)="cambiarCamara()" [disabled]="loading"></button>
</div>

  <p-progressSpinner *ngIf="loading" strokeWidth="4"></p-progressSpinner>

  <!-- Vista previa de la foto tomada -->
  <div class="photo-preview" *ngIf="imagenDataURL">
    <p>Vista previa:</p>
    <img [src]="imagenDataURL" alt="Foto capturada" />
  </div>

  
</div>
