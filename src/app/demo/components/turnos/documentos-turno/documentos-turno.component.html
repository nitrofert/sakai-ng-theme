<p-toast [baseZIndex]="10001"></p-toast>
<p-confirmDialog
    [style]="{ width: '50vw' }"
    [baseZIndex]="10000"
    rejectButtonStyleClass="p-button-text"
></p-confirmDialog>
<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="p-fluid p-formgrid grid">
                <p-divider align="left" class="field col-12">
                    <div class="inline-flex align-items-center">
                        <i class="pi pi-info-circle mr-2"></i>
                        <b>Documentos</b>
                    </div>
                </p-divider>

                <div class="field col-12">
                    <div class="card">
                        <p-table
                            #dt1
                            [value]="documentos"
                            [rowHover]="true"
                            [styleClass]="
                                'p-datatable-gridlines p-datatable-sm border-1 '
                            "
                            [paginator]="false"
                            responsiveLayout="scroll"
                        >
                            <ng-template pTemplate="header">
                                <tr>
                                    <th>
                                        <div class="text-left">Documento</div>
                                    </th>

                                    <th style="width: 3rem"></th>
                                </tr>
                            </ng-template>
                            <ng-template pTemplate="body" let-itemData>
                                <tr>
                                    <td class="text-left">
                                        {{ itemData.label }}
                                    </td>

                                    <td class="text-center">
                                        <button
                                            pButton
                                            [pTooltip]="'Generar PDF'"
                                            tooltipPosition="bottom"
                                            placeholder="Bottom"
                                            class="p-button-outlined mb-2 mr-2 p-button-danger p-button-sm"
                                            icon="pi pi-file-pdf"
                                            (click)="generarPDF(itemData.tipo)"
                                        ></button>
                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>
                    </div>
                </div>
                <!--
                <p-divider align="left" class="field col-12">
                    <div class="inline-flex align-items-center">
                        <i class="pi pi-info-circle mr-2"></i>
                        <b>Anexos</b>
                    </div>
                </p-divider>
                -->
                <p-divider align="left" class="field col-12">
                    <div class="inline-flex align-items-center">
                        <i class="pi pi-info-circle mr-2"></i>
                        <b>Evidencias de cargue</b>
                    </div>
                </p-divider>

                <div class="field col-12">
                    <div class="card">
                        <p-table
                            #dt1
                            [value]="evidencias_cargue"
                            [rowHover]="true"
                            [styleClass]="
                                'p-datatable-gridlines p-datatable-sm border-1 '
                            "
                            [paginator]="false"
                            responsiveLayout="scroll"
                        >
                            <ng-template pTemplate="header">
                                <tr>
                                    <th>
                                        <div class="text-left">Cliente</div>
                                    </th>

                                    <th>
                                        <div class="text-left">Producto</div>
                                    </th>

                                    <th style="width: 3rem"></th>
                                </tr>
                            </ng-template>
                            <ng-template pTemplate="body" let-itemData>
                                <tr>
                                    <td class="text-left">
                                        {{ itemData.cliente }}
                                    </td>

                                    <td class="text-left">
                                        {{ itemData.producto }}
                                    </td>

                                    <td class="text-center">
                                        <button
                                            pButton
                                            [pTooltip]="'Descargar archivo'"
                                            tooltipPosition="bottom"
                                            placeholder="Bottom"
                                            class="p-button-outlined mb-2 mr-2 p-button-info p-button-sm"
                                            icon="pi pi-image"
                                            (click)="
                                                downloadFile(itemData.linkS3)
                                            "
                                        ></button>
                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Dialog loading -->
<p-dialog
    header="Cargando"
    [(visible)]="displayModal"
    [modal]="true"
    [style]="{ width: '50vw' }"
    [draggable]="false"
    [resizable]="false"
>
    <p class="m-0"></p>

    <div
        *ngIf="loadingCargue"
        class="field col flex justify-content-center align-items-center"
    >
        <!--<p-progressBar mode="indeterminate" [style]="{'height': '6px'}"></p-progressBar>-->
        <!--<p-progressSpinner></p-progressSpinner>-->
        <img src="assets/layout/images/Rhombus.gif" alt="" />
    </div>
    <div
        *ngIf="completeCargue"
        class="field col flex justify-content-center align-items-center animation-duration-1000 animation-ease-out"
    >
        <div class="text-center">
            <span>{{ messageComplete }}</span>
            <span
                >Esta ventana se cerrara automaticamente en unos segundos, si
                esto no ocurre puede cerrarla manualmente.</span
            >
        </div>
    </div>
</p-dialog>
<!--Fin Dialog loading-->
