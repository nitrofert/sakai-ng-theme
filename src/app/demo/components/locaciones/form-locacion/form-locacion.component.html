<p-toast></p-toast>
<p-confirmDialog [style]="{width: '50vw'}" [baseZIndex]="10000" rejectButtonStyleClass="p-button-text"></p-confirmDialog>
<div class="grid">
	<div class="col-12">
		<div class="card">
            <div class="p-fluid p-formgrid grid">

                <div *ngIf="!editLocacion" class="field col-12 mt-3">
                    <span class="p-float-label">
                        <p-skeleton *ngIf="locacionesSAP.length==0" height="2rem" styleClass="mb-2"></p-skeleton>
                        <p-autoComplete id="almacen"
                                        *ngIf="locacionesSAP.length>0"
                                        [(ngModel)]="locacionSeleccionada"
                                        [suggestions]="locacionesFiltrados"
                                        (completeMethod)="filtrarLocacion($event)"
                                        field="label"
                                        [disabled]="editLocacion"
                                        [dropdown]="true"
                                        [ngClass]="{'ng-invalid ng-dirty' : (!locacionSeleccionada || locacionSeleccionada.length == 0) && submitLocacion }"
                                        (onSelect)="seleccionarLocacion(locacionSeleccionada)"
                                        (ngModelChange)="cambioLocacion()">
                        </p-autoComplete>
                        <label *ngIf="locacionesSAP.length==0" for="almacen"><h6>Cargando locaciones ...</h6></label>
                        <label *ngIf="locacionesSAP.length>0" for="almacen"><h6>Seleccione una locación para registrar</h6></label>
                    </span>
                </div>

                <div *ngIf="editLocacion" class="field col-12">
                    <span class="p-float-label">
                        <input pInputText id="locacion" type="text" disabled="true" [(ngModel)]="locacion"/>
                        <label for="locacion"><h6>Locación</h6></label>
                    </span>
                </div>

                <div class="field col-12">
                    <span class="p-float-label">
                        <input pInputText id="locacion2" type="text" [(ngModel)]="locacion2"/>
                        <label for="locacion2"><h6>Locación real</h6></label>
                    </span>
                </div>

                <div class="field col-12">
                    <span class="p-float-label">
                        <input pInputText id="email_bodega" type="email"
                               [ngClass]="{'ng-invalid ng-dirty' : !email_bodega && submitLocacion }"
                               [(ngModel)]="email_bodega"/>
                        <label for="email_bodega"><h6>Email locación</h6></label>
                    </span>
                </div>

                <div class="field col-12">
                    <span class="p-float-label">
                        <input pInputText id="direccion" type="text" [(ngModel)]="direccion"/>
                        <label for="direccion"><h6>Dirección locación</h6></label>
                    </span>
                </div>

                <div class="field col-12">
                    <span class="p-float-label">
                        <input pInputText id="ubicacion" type="text" [(ngModel)]="ubicacion"/>
                        <label for="ubicacion"><h6>Ubicación locación</h6></label>
                    </span>
                </div>

                <!-- Horarios -->
                <div class="field col-12">
                    <div class="card">
                        <h6 class="mb-3">Horarios de atención</h6>
                        <app-dynamic-table [dataTable]="dataTable"
                            [headersTable]="headersTable"
                            dataKey="id"
                            [rows]="10"
                            [paginator]="true"
                            [selectionMode]="'multiple'"
                            [showBtnNew]="showBtnNew"
                            [showBtnEdit]="showBtnEdit"
                            [showBtnExp]="showBtnExp"
                            [showBtnDelete]="showBtnDelete"
                            nameExport="horarios_locacion"
                            (onEditAccion)="editHorario($event)"
                            (onDeleteAccion)="deleteHorario($event)"
                            (onNewAccion)="nuevoHorario($event)">
                        </app-dynamic-table>
                    </div>
                </div>

                <!-- Bodegas -->
                <div class="field col-12">
                    <div class="card">
                        <h6 class="mb-3">Bodegas asociadas</h6>
                        <app-dynamic-table [dataTable]="dataTableBodegas"
                            [headersTable]="headersBodegasTable"
                            dataKey="id"
                            [rows]="10"
                            [paginator]="true"
                            [selectionMode]="'multiple'"
                            [showBtnNew]="showBtnNew"
                            [showBtnEdit]="showBtnEdit"
                            [showBtnExp]="showBtnExp"
                            [showBtnDelete]="showBtnDelete"
                            nameExport="bodegas_locacion"
                            (onEditAccion)="editBodega($event)"
                            (onDeleteAccion)="deleteBodega($event)"
                            (onNewAccion)="nuevaBodega($event)">
                        </app-dynamic-table>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<div class="grid">
    <div class="col-12">
        <div class="flex justify-content-end">
            <button type="button" (click)="grabarLocacion()" pButton icon="pi pi-save" label="Grabar cambios"></button>
            <button type="button" (click)="cerrar()" pButton icon="pi pi-times" label="Cerrar" class="p-button-secondary ml-3"></button>
        </div>
    </div>
</div>


<!-- Dialog horario -->
<p-dialog [header]="tituloFormHorario"
          [(visible)]="formHorarios"
          [modal]="true"
          [style]="{width: '60vw'}"
          [draggable]="false"
          [resizable]="false">

    <div class="grid">
        <div class="col-12">
            <div class="card">
                <div class="p-fluid p-formgrid grid">
                    <div class="field col-12 mt-3">
                        <span class="p-float-label">
                            <p-multiSelect [options]="diasAtencion"
                                            [(ngModel)]="diasSeleccionados"
                                            defaultLabel="Seleccione los días de atención"
                                            optionLabel="fullname"
                                            display="chip"
                                            [ngClass]="{'ng-invalid ng-dirty' : diasSeleccionados.length==0 && submitHorario }">
                            </p-multiSelect>
                            <label for="diasAtencion"><h6>Días de atención</h6></label>
                        </span>
                    </div>
                    <div class="field col-12 md:col-6 mt-3">
                        <span class="p-float-label">
                            <p-calendar [(ngModel)]="horainicio"
                                        [timeOnly]="true"
                                        [hourFormat]="'12'"
                                        inputId="horainicio"
                                        [ngClass]="{'ng-invalid ng-dirty' : horainicio >= horafin && submitHorario }">
                            </p-calendar>
                            <label for="horainicio"><h6>Hora inicio</h6></label>
                        </span>
                    </div>
                    <div class="field col-12 md:col-6 mt-3">
                        <span class="p-float-label">
                            <p-calendar [(ngModel)]="horafin"
                                        [timeOnly]="true"
                                        [hourFormat]="'12'"
                                        inputId="horafin"
                                        [ngClass]="{'ng-invalid ng-dirty' : horainicio >= horafin && submitHorario }">
                            </p-calendar>
                            <label for="horafin"><h6>Hora fin</h6></label>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <p-button icon="pi pi-check" (click)="grabarHorario()" label="Grabar horario" styleClass="p-button-text"></p-button>
    </ng-template>

</p-dialog>


<!-- Dialog bodega -->
<p-dialog [header]="tituloFormBodega"
          [(visible)]="formBodegas"
          [modal]="true"
          [style]="{width: '60vw'}"
          [draggable]="false"
          [resizable]="false">

    <div class="grid">
        <div class="col-12">
            <div class="card">
                <div class="p-fluid p-formgrid grid">

                    <!-- Nueva bodega: multiselect desde SAP -->
                    <ng-container *ngIf="!editBodegaMode">
                        <div class="field col-12 mt-3">
                            <span class="p-float-label">
                                <p-multiSelect [options]="bodegasSAPDisponibles"
                                               [(ngModel)]="bodegasSAPSeleccionadas"
                                               optionLabel="label"
                                               defaultLabel="Seleccione bodegas de SAP"
                                               display="chip"
                                               [filter]="true"
                                               filterBy="label"
                                               appendTo="body"
                                               [ngClass]="{'ng-invalid ng-dirty': bodegasSAPSeleccionadas.length == 0 && submitBodega}">
                                </p-multiSelect>
                                <label><h6>Bodegas SAP disponibles</h6></label>
                            </span>
                        </div>
                    </ng-container>

                    <!-- Editar bodega: selector SAP opcional + campos manuales -->
                    <ng-container *ngIf="editBodegaMode">
                        <div class="field col-12 mt-3" *ngIf="bodegasSAPDisponibles.length > 0">
                            <span class="p-float-label">
                                <p-autoComplete id="bodegaSAP"
                                                [(ngModel)]="bodegaSAPSeleccionada"
                                                [suggestions]="bodegasSAPFiltradas"
                                                (completeMethod)="filtrarBodegaSAP($event)"
                                                field="label"
                                                [dropdown]="true"
                                                appendTo="body"
                                                (onSelect)="seleccionarBodegaSAP(bodegaSAPSeleccionada)">
                                </p-autoComplete>
                                <label for="bodegaSAP"><h6>Seleccionar desde SAP (opcional)</h6></label>
                            </span>
                        </div>
                        <div class="field col-12 md:col-4 mt-3">
                            <span class="p-float-label">
                                <input pInputText id="bodegaCodigo" type="text"
                                       [ngClass]="{'ng-invalid ng-dirty' : !bodegaCodigo && submitBodega }"
                                       [(ngModel)]="bodegaCodigo"/>
                                <label for="bodegaCodigo"><h6>Código</h6></label>
                            </span>
                        </div>
                        <div class="field col-12 md:col-8 mt-3">
                            <span class="p-float-label">
                                <input pInputText id="bodegaNombre" type="text"
                                       [ngClass]="{'ng-invalid ng-dirty' : !bodegaNombre && submitBodega }"
                                       [(ngModel)]="bodegaNombre"/>
                                <label for="bodegaNombre"><h6>Nombre</h6></label>
                            </span>
                        </div>
                        <div class="field col-12 mt-3">
                            <span class="p-float-label">
                                <input pInputText id="bodegaDescripcion" type="text" [(ngModel)]="bodegaDescripcion"/>
                                <label for="bodegaDescripcion"><h6>Descripción (opcional)</h6></label>
                            </span>
                        </div>
                    </ng-container>

                </div>
            </div>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <p-button icon="pi pi-check" (click)="grabarBodega()" label="Grabar bodega" styleClass="p-button-text"></p-button>
    </ng-template>

</p-dialog>
